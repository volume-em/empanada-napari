name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      # PRs and non-tag pushes: verify the package builds (satisfies required check).
      - name: Validate package build
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          uv build
          echo "Package build succeeded"

      # Tag pushes only: publish to PyPI.
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv build
          uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TWINE_API_KEY }}
